services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ah_crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ah_crm
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ah_crm"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
