name: Temporary exact source review
on:
  push:
    branches: [codex/production-hardening-2026-10-04]
    paths:
      - scripts/review-plan.json
      - .github/workflows/review-executor.yml
permissions:
  contents: read
concurrency:
  group: crm-exact-source-review
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'Waleedmsd/ah-interiors-crm' && github.ref == 'refs/heads/codex/production-hardening-2026-10-04'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout exact review commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Inspect source or apply explicitly reviewed exact replacements
        run: node scripts/review-executor.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
